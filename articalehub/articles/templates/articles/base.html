<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}ArticleHub{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            body {
                font-family: Georgia, "Times New Roman", serif;
                background-color: #ffffff;
            }

            .navbar-brand {
                font-weight: 700;
                font-size: 30px;
            }

            .content {
                max-width: 720px;
            }

            .navbar .content {
                flex-wrap: wrap;
            }

            .app-btn {
                align-items: center;
                display: inline-flex;
                height: 40px;
                justify-content: center;
                max-width: 100%;
                padding: 0 16px;
                white-space: nowrap;
                width: 190px;
            }

            .user-greeting {
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-light border-bottom mb-4">
            <div class="container content d-flex align-items-center gap-3">
                <a href="{% url 'article_list' %}" class="navbar-brand">ArticleHub</a>
                {% if user.is_authenticated %}
                    <a class="btn btn-dark app-btn ms-auto" href="{% url 'article_create' %}">
                        Добавить статью
                    </a>
                    <span class="user-greeting">Привет, {{ user.username }}</span>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-dark app-btn" type="submit">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-dark app-btn ms-auto" href="{% url "login" %}">
                        Войти в систему
                    </a>

                    <a class="btn btn-dark app-btn" href="{% url "register" %}">
                        Регистрация
                    </a>

                {% endif %}

            </div>

        </nav>
        <main class="container content">
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
